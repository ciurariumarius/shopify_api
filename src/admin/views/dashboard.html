<h1>Dashboard</h1>
<div class="cards">
  <div class="card"><div class="num">{{shopCount}}</div><div class="lbl">Total shops</div></div>
  <div class="card"><div class="num">{{installedCount}}</div><div class="lbl">Installed</div></div>
  <div class="card"><div class="num">{{activeKeys}}</div><div class="lbl">Active API keys</div></div>
</div>

<h2 class="section">Sync activity (last 7 days)</h2>
<div class="cards">
  <div class="card"><div class="num">{{syncSuccess}}</div><div class="lbl">Successful</div></div>
  <div class="card"><div class="num">{{syncError}}</div><div class="lbl">Errors</div></div>
  <div class="card"><div class="num">{{syncRunning}}</div><div class="lbl">Running</div></div>
</div>

<h2 class="section">Last sync</h2>
<p>{{lastSync}}</p>
