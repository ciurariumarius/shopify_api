<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Shopify Connector</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f6f6f7; color: #202223; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #1a1a1a; color: #e3e3e3; flex-shrink: 0; }
    .sidebar h2 { font-size: 15px; padding: 20px; margin: 0; border-bottom: 1px solid #333; color: #fff; }
    .nav-item { display: block; padding: 12px 20px; color: #cfcfcf; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
    .nav-item:hover { background: #262626; color: #fff; }
    .nav-item.active { background: #262626; color: #fff; border-left-color: #008060; }
    .logout { padding: 16px 20px; }
    .logout button { width: 100%; padding: 8px; background: #333; color: #ddd; border: none; border-radius: 6px; cursor: pointer; }
    .main { flex: 1; padding: 28px 36px; overflow-x: auto; }
    h1 { font-size: 22px; margin: 0 0 20px; }
    h2.section { font-size: 16px; margin: 28px 0 12px; }
    .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); min-width: 160px; }
    .card .num { font-size: 28px; font-weight: 600; }
    .card .lbl { font-size: 13px; color: #6d7175; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    th { background: #fafafa; font-weight: 600; color: #6d7175; }
    tr:last-child td { border-bottom: none; }
    code { background: #f1f1f1; padding: 1px 5px; border-radius: 4px; font-size: 12px; word-break: break-all; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-green { background: #e3f1df; color: #108043; }
    .badge-red { background: #fbeae5; color: #bf0711; }
    .badge-yellow { background: #fcf1cd; color: #8a6116; }
    .badge-gray { background: #eee; color: #555; }
    .btn { display: inline-block; padding: 8px 14px; background: #008060; color: #fff; border: none; border-radius: 6px; text-decoration: none; font-size: 13px; cursor: pointer; }
    .btn:hover { background: #006e52; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-danger { background: #bf0711; }
    .btn-danger:hover { background: #a00510; }
    .actions { white-space: nowrap; }
    form.inline { display: inline; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
    .filters label { display: block; font-size: 12px; color: #6d7175; margin-bottom: 3px; }
    .filters input, .filters select { padding: 7px 9px; border: 1px solid #ddd; border-radius: 6px; }
    .pager { display: flex; gap: 12px; align-items: center; margin-top: 14px; font-size: 13px; }
    .error { color: #bf0711; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
    .modal { background: #fff; padding: 28px; border-radius: 12px; max-width: 520px; width: 90%; }
    .modal code { display: block; padding: 12px; margin: 12px 0; background: #f1f1f1; }
  </style>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <h2>Shopify Connector</h2>
      {{nav}}
      <div class="logout">
        <form method="post" action="/admin/logout">
          <button type="submit">Log out</button>
        </form>
      </div>
    </nav>
    <main class="main">
      {{content}}
    </main>
  </div>
</body>
</html>
