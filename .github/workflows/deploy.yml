name: Deploy shopify_api

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to CloudPanel Host
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            # Force the working tree to match remote (server-local edits to tracked
            # files like package-lock.json would otherwise abort the merge).
            # .env is gitignored/untracked, so it is left untouched.
            git fetch origin main
            git reset --hard origin/main
            npm install
            npx prisma generate
            npx prisma migrate deploy
            # pm2 may not be on PATH in a non-login SSH shell; npx resolves it.
            npx pm2 startOrReload ecosystem.config.js --env production
            npx pm2 save
