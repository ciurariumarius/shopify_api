name: Deploy shopify_api

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to CloudPanel Host
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            git pull origin main
            npm install
            npx prisma generate
            npx prisma migrate deploy
            pm2 startOrReload ecosystem.config.js --env production
            pm2 save
